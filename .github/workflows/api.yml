name: API

# Path-filtered CI for apps/api (docs/migration/02-backend-and-database.md "M6"). Ported from the backend repo's
# own ci.yml. Runs only when the API, the install/build config, or this file changes.
# The root ci.yml excludes @rakhal/api (it needs Postgres/Redis and its `lint` script runs with --fix).
on:
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/api.yml"
  # Manual run, also the only trigger for the advisory e2e job below.
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

# Dummy values only. src/core/config/env/env.ts validates the environment at import time and calls
# process.exit(1) when these are missing, which fails every spec that imports PrismaService.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012345678
  JWT_ADMIN_SECRET: ci-admin-secret-0123456789abcdef0123456789
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  EMAIL_FROM: ci@example.test
  EMAIL_VERIFICATION_BASE_URL: http://localhost:3000/verify
  EMAIL_PASSWORD_RESET_BASE_URL: http://localhost:3000/reset

defaults:
  run:
    working-directory: apps/api

jobs:
  verify:
    name: Install, migrate, build, unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # No `version:` here: the root package.json "packageManager" (pnpm 11) is the single source. Giving both makes
      # the action fail with "Multiple versions of pnpm specified". The backend's own CI used @v6 for pnpm 11.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - run: pnpm prisma:generate

      # Applies every migration to an empty database, so a broken or out-of-order migration fails here.
      - name: Apply migrations to an empty database
        run: pnpm exec prisma migrate deploy --config prisma.config.ts

      - run: pnpm build

      # Fails when a controller or DTO changed but openapi/*.json was not regenerated (run `pnpm gen:openapi`).
      # Reuses the build above and needs no database: it scans controller metadata only (Nest preview mode).
      - name: OpenAPI drift check
        run: node dist/tools/generate-openapi.js --check

      # The unit suite includes a real-DB spec (sale-number allocator), hence the Postgres service.
      - name: Unit tests
        run: pnpm exec jest --silent

      # ADVISORY until the existing lint debt (about 188 errors in 32 files, measured 2026-11-10) is cleared.
      # Do not use `pnpm lint`: that script runs with --fix and would rewrite files in CI.
      # Remove continue-on-error once lint is clean, so it becomes a required check.
      - name: Lint (advisory)
        continue-on-error: true
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

  e2e:
    name: E2E, batched (manual, advisory, not yet verified in CI)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm prisma:generate
      - run: pnpm exec prisma migrate deploy --config prisma.config.ts
      - run: pnpm seed
      # One jest process per batch of 25 specs: a single --runInBand run over the whole suite runs out of memory.
      - run: pnpm test:e2e:batched
