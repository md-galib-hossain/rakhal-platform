name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json's "packageManager" (pnpm@10.0.0) is the single source. Giving both makes
      # the action fail with "Multiple versions of pnpm specified" before any step runs.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/web has its own path-filtered workflow (web.yml); everything else is verified here.
      - run: pnpm turbo run lint typecheck test --filter='!@rakhal/web'
      - run: pnpm turbo run build --filter='!@rakhal/web'
