name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # No `cache: pnpm` here on purpose. This repo's committed `.npmrc` pins `store-dir` to a Windows path, which
      # `setup-node` resolves on the Linux runner and then cannot find, so its post-step fails the whole job ("Path(s)
      # specified in the action for caching do(es) not exist") even though every real step passed. Install below
      # already overrides the store with a CLI flag; add caching back once `.npmrc` stops pinning a machine path.
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      # This repo's committed `.npmrc` pins `store-dir` to a Windows dev-machine path
      # (`D:/.pnpm-store-rakhal-fe`, a local corrupted-pnpm-store workaround — see CURRENT_STATE.md's
      # "Known environment issue"). It doesn't apply on a Linux runner, so point the store at a
      # cacheable Linux path instead; CLI flags outrank project `.npmrc` in pnpm's config precedence.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      - run: pnpm lint

      # `next-env.d.ts` is gitignored and only generated by Next. On a fresh checkout it does not exist, so `tsc`
      # fails with "Cannot find module '@/public/....png'" on every image import. Generate it before typecheck.
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # lib/env.ts validates these but both have working localhost defaults — set explicitly for
          # CI determinism rather than relying on the fallback. No backend is needed to build.
          NEXT_PUBLIC_APP_URL: http://localhost:3001
          API_BASE_URL: http://localhost:3000/api/v1

  lighthouse:
    name: Lighthouse CI (public routes)
    runs-on: ubuntu-latest
    needs: checks
    env:
      # Job-level so the Lighthouse action's own spawned `pnpm start` process (not just this job's
      # `run:` steps) inherits them too.
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      # The proxy hands every non-landing path to `NEXT_PUBLIC_FARM_URL`, which defaults to the live
      # https://farm.rakhal.app. Without this, auditing `/` followed a redirect to PRODUCTION. Keep hand-offs local.
      NEXT_PUBLIC_FARM_URL: http://localhost:3001
      API_BASE_URL: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      - name: Build
        run: pnpm build

      # Only `/` and `/login` are audited here — every other route in the app is behind the auth
      # gate (`(app)/layout.tsx` redirects to `/login` without a session) and this workflow has no
      # backend/Postgres/Redis service to log a real session in with. Auditing `/dashboard`/`/cattle`
      # per ARCHITECTURE.md §7 needs a CI backend (Docker services + `pnpm seed`, cross-repo checkout
      # of `rakhal-backend`) — flagged as a follow-up (PROJECT_PROGRESS.md RFE-010 entry), not faked
      # by pointing Lighthouse at the gate-redirect page.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        # The URLs and the server start command live in `lighthouserc.json` (`ci.collect`), not here: this action
        # does not accept `startServerCommand` / `startServerReadyPattern` / `startServerReadyTimeout` as inputs
        # (it only logs "Unexpected input(s)"), so the app server was never started. `pnpm start` would also have
        # listened on 3005 (the dev port in package.json), not the 3001 audited here.
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
