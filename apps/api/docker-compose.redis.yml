services:
  redis:
    image: redis:7-alpine
    container_name: rakhal-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - noeviction

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis-data:/data

    mem_limit: 1g

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
    name: rakhal-redis-data